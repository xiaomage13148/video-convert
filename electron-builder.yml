appId: com.video-convert.pro
productName: Video Convert Pro
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules"
beforePack: ./scripts/prepare-ffmpeg.cjs
extraResources:
  - from: resources
    to: .
    filter:
      - ffmpeg.exe
      - ffprobe.exe
  - from: build/icon.png
    to: icon.png
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
buildDependenciesFromSource: false
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
